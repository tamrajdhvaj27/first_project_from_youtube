# The main pipeline for first_project_asset_bundle

resources:
  pipelines:
    bronze_to_sliver_earthquake_etl:
      name: Bronze_Silver_Prod
      configuration:
          catalog_name: ${var.catalog}
      libraries:
        - glob:
            include: ../src/DLT_piplines/Bronze_to_silver/transformations/**

      schema: silver
      continuous: false
      development: false
      photon: true
      channel: CURRENT
      catalog: ${var.catalog}
      serverless: true
      root_path: ../src/DLT_piplines/Bronze_to_silver