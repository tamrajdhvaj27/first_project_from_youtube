resources:
  jobs:
    youtube_earthquake_end_end_job:
      name: youtube_earthquake_end_job_Prod 
      tasks:
        - task_key: ingestion_Bronze
          notebook_task:
            notebook_path: ../src/notebooks/01_ingestion_to_bronze.ipynb
            base_parameters:
              catalog_name: ${var.catalog}
            source: WORKSPACE
        - task_key: Bronze_to_Silver
          depends_on:
            - task_key: ingestion_Bronze
          pipeline_task:
            pipeline_id: ${resources.pipelines.bronze_to_sliver_earthquake_etl.id}
            full_refresh: false
        - task_key: Earthquake_dashoard
          depends_on:
            - task_key: Bronze_to_Silver
          dashboard_task:
            subscription: {}
            warehouse_id: fb2868bef2641aff
            dashboard_id: ${resources.dashboards.earthquake_monitor.id}
      queue:
        enabled: true
      parameters:
        - name: catalog_name
          default: ${var.catalog}
      performance_target: PERFORMANCE_OPTIMIZED
