name: Deployment Databricks Asset Bundle

on:
  push:
    brnaches:
      - main

jobs:
  deploys:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy Asset Bundle
        uses: uses: databricks/setup-cli@v0
        with:
          working-directory: ./first_project_asset_bundle
          databricks-host: ./https://dbc-f6ab2eda-6073.cloud.databricks.com
          databricks-bundle-env: prod
          authentication-type: token
          databicks-totken: ${{ secrets.DATABRICKS_TOKEN}}
        
